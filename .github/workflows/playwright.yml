name: E2E on deployment

# Runs the end-to-end tests against each successful Vercel deployment (preview and
# production). Pull request CI (ci.yml) tests a local build. This workflow checks the
# real deployment: hosting, headers and link preview images with Vercel's URLs.
#
# The tests come from the default branch, because they only talk to the deployment
# over HTTP. A pull request that changes behaviour can therefore fail here until it is
# merged. CI on the pull request is the gate.
#
# Security: GitHub runs this workflow file from the deployed commit. A deployment of a
# fork's pull request would run the fork's copy of this file with access to the
# "vercel-e2e" environment secrets. Keep Vercel's Git Fork Protection on and never approve
# a fork deployment without reading it first (docs/setup-checklist.md).

on:
  deployment_status:

permissions:
  contents: read

concurrency:
  group: e2e-deployed-${{ github.event.deployment.environment }}-${{ github.event.deployment.ref }}
  cancel-in-progress: true

jobs:
  e2e-deployed:
    name: e2e (deployed)
    if: >-
      github.event.deployment_status.state == 'success' &&
      startsWith(github.event.deployment_status.environment_url, 'https://')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Holds VERCEL_AUTOMATION_BYPASS_SECRET. "deployment: false" uses the environment's
    # secrets without recording a GitHub deployment.
    environment:
      name: vercel-e2e
      deployment: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      # With BASE_URL set, Playwright starts no local server. playwright.config.ts sends
      # the bypass header only when the secret is set.
      - name: Run Playwright tests against the deployment
        run: npx playwright test --project=api --project=chromium
        env:
          BASE_URL: ${{ github.event.deployment_status.environment_url }}
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report-deployed
          path: playwright-report/
          retention-days: 14
