name: E2E on deployment

# Runs the end-to-end tests against each successful Vercel production deployment. Pull
# request CI (ci.yml) tests a local build. This workflow checks the real site: hosting,
# headers and link preview images with Vercel's URLs.
#
# The tests come from the default branch. On a production deployment that is the code
# Vercel deployed, so the tests match it. Preview deployments of pull requests are skipped:
# their code can be newer than the default branch's tests (or need a newer Playwright), so
# those runs would fail for reasons that say nothing about the deployment. CI on the pull
# request is the gate.
#
# Security: GitHub runs this workflow file from the deployed commit. A deployment of a
# fork's pull request would run the fork's copy of this file with access to the
# "vercel-e2e" environment secrets. Keep Vercel's Git Fork Protection on and never approve
# a fork deployment without reading it first (docs/setup-checklist.md).
# The job runs only for deployment statuses created by Vercel's GitHub App
# ("vercel[bot]", the creator on this repository's real deployments).
#
# Owner option, not used yet: Vercel also sends a repository_dispatch event
# ("vercel.deployment.success", URL in github.event.client_payload.url). GitHub always
# runs repository_dispatch workflows from the default branch's file, so a fork cannot
# change the workflow that receives the secret. Switching means changing the trigger
# and the BASE_URL line. See https://vercel.com/docs/git/vercel-for-github.

on:
  deployment_status:

permissions:
  contents: read

concurrency:
  group: e2e-deployed-${{ github.event.deployment.environment }}-${{ github.event.deployment.ref }}
  cancel-in-progress: true

jobs:
  e2e-deployed:
    name: e2e (deployed)
    if: >-
      github.event.deployment_status.state == 'success' &&
      github.event.deployment.environment == 'Production' &&
      github.event.deployment_status.creator.login == 'vercel[bot]' &&
      startsWith(github.event.deployment_status.environment_url, 'https://')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Holds VERCEL_AUTOMATION_BYPASS_SECRET. "deployment: false" uses the environment's
    # secrets without recording a GitHub deployment.
    environment:
      name: vercel-e2e
      deployment: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      # With BASE_URL set, Playwright starts no local server. playwright.config.ts sends
      # the bypass header only when the secret is set.
      - name: Run Playwright tests against the deployment
        run: npx playwright test --project=api --project=chromium
        env:
          BASE_URL: ${{ github.event.deployment_status.environment_url }}
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report-deployed
          path: playwright-report/
          retention-days: 14
