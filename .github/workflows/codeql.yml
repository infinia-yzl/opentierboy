name: CodeQL

# CodeQL advanced setup. While CodeQL "default setup" is on, GitHub rejects the results
# this workflow uploads ("Upload with CodeQL results rejected due to default setup") and
# the run fails. Switch the repository to advanced setup before merging this file
# (docs/setup-checklist.md).

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    # Weekly, Monday 03:17 UTC.
    - cron: '17 3 * * 1'

permissions:
  contents: read

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      # Upload results to the Security tab.
      security-events: write
      # Read workflow run information and private CodeQL packs.
      actions: read
      packages: read
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          # JavaScript and TypeScript need no build.
          - language: javascript-typescript
            build-mode: none
          # The workflow files in .github/workflows.
          - language: actions
            build-mode: none
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          queries: security-extended

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          category: /language:${{ matrix.language }}
