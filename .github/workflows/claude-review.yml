name: Claude review

# Claude reviews each pull request with the code-review plugin and comments on it:
# inline comments for the issues it finds, or one summary comment when it finds none.
# Setup and cost: docs/setup-checklist.md. Docs: https://code.claude.com/docs/en/github-actions
#
# The review runs only when the CLAUDE_CODE_OAUTH_TOKEN secret is set, and only for
# pull requests from branches of this repository (fork pull requests get no secrets).
# Comments are posted by the Claude GitHub App. The workflow token stays read-only.

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]

permissions: {}

concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  # A job-level `if` cannot read secrets, so this job turns "is the secret set?"
  # into an output. It never sees the secret's value.
  gate:
    name: gate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    outputs:
      has_token: ${{ steps.token.outputs.has_token }}
    steps:
      - id: token
        run: echo "has_token=${HAS_TOKEN}" >> "$GITHUB_OUTPUT"
        env:
          HAS_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN != '' }}

  review:
    name: review
    needs: gate
    # Skip without failing when the secret is missing, for forks, for drafts (the plugin
    # skips drafts too; this saves the runner) and for bots. The action fails the run for
    # any bot that is not in its allowed_bots list, so pull requests opened or updated by
    # a bot (Dependabot, the image pipeline bot) skip here. Marking a draft
    # "ready for review" starts a review.
    if: >-
      needs.gate.outputs.has_token == 'true' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      !github.event.pull_request.head.repo.fork &&
      github.actor != 'dependabot[bot]' &&
      github.event.pull_request.user.type != 'Bot' &&
      !endsWith(github.actor, '[bot]') &&
      !github.event.pull_request.draft
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: read
      issues: read
      # Exchanged for a Claude GitHub App token, which posts the comments.
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      # The plugin only reports issues that break a rule in CLAUDE.md or are clear bugs.
      # CLAUDE.md ("Review rules") lists the security checks, so they count as rules.
      # The action reads CLAUDE.md from the base branch, so a pull request cannot
      # weaken its own review.
      - uses: anthropics/claude-code-action@16f9f71ab9c490faf367f94dd294897edc25be33 # v1.0.261
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          plugin_marketplaces: https://github.com/anthropics/claude-code.git
          plugins: code-review@claude-code-plugins
          prompt: |
            /code-review:code-review --comment ${{ github.repository }}/pull/${{ github.event.pull_request.number }}

            Also review the changed code for security problems and treat each one as a bug:
            cross-site scripting, unsafe URLs, server-side fetches of user-supplied URLs,
            untrusted input (shared links, uploaded or pasted files) parsed without validation
            or size limits, secrets in code or logs, and GitHub Actions workflows with broad
            permissions, pull_request_target, or event data interpolated into run steps.
            Also flag any change that breaks a product rule in CLAUDE.md, for example old
            shared links that would stop opening or item ids that would change.
          claude_args: '--allowedTools "mcp__github_inline_comment__create_inline_comment"'
