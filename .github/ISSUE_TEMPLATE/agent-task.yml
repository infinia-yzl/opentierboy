name: Agent task
description: A task written for a coding agent (Claude, Copilot) or a contributor to pick up.
title: "[Task] "
labels: ["agent-task"]
body:
  - type: markdown
    attributes:
      value: |
        Write the task so someone without background can finish it.
        The agent follows CLAUDE.md. It asks before it changes behaviour that users can see.
  - type: textarea
    id: context
    attributes:
      label: Context
      description: >-
        What is the problem or goal? Link issues, pull requests, shared links or screenshots.
        Name the files or pages involved if you know them.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: >-
        How do we know it is done? One checkable line each. Include the tests that must
        pass or be added.
      placeholder: |
        - [ ] Opening <link> shows ...
        - [ ] New e2e test in tests/e2e/... covers ...
        - [ ] npm run check passes
    validations:
      required: true
  - type: textarea
    id: out-of-scope
    attributes:
      label: Out of scope
      description: >-
        What must not change? List behaviour, files or features to leave alone.
      placeholder: |
        - No change to how existing shared links open
        - No new dependencies
    validations:
      required: true
  - type: textarea
    id: notes
    attributes:
      label: Notes
      description: Anything else that helps, such as hints, risks or open questions.
    validations:
      required: false
